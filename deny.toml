# cargo-deny 0.19+ configuration.
# Run `cargo deny check` locally; CI runs deny per matrix {advisories, bans, licenses, sources}.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[output]
feature-depth = 1

# --- Security advisories (RustSec DB; subsumes cargo-audit) ---
[advisories]
version = 2
yanked  = "warn"
ignore  = []

# --- License policy (AGPL-3.0 project; only permissive deps allowed) ---
[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "AGPL-3.0-only",    # workspace crates themselves
]
confidence-threshold = 0.8

# `ring` carries a composite MIT/ISC/OpenSSL license.
# IMPORTANT: The hash below is a TEMPLATE VALUE. Before the deny/licenses CI
# job passes, run `cargo deny check licenses` locally and replace the hash
# with the value shown in the error output for the actual ring version.
[[licenses.clarify]]
crate         = "ring"
expression    = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# --- Crate bans (enforce CLAUDE.md dependency discipline) ---
[bans]
multiple-versions         = "warn"
wildcards                 = "deny"
highlight                 = "all"
workspace-default-features = "allow"
external-default-features  = "allow"

[[bans.deny]]
crate  = "serde_yaml"
reason = "archived upstream (Oct 2024); use serde_yaml_ng"

[[bans.deny]]
crate  = "serde_yml"
reason = "RUSTSEC-2025-0068 (CVE fork of archived serde_yaml); use serde_yaml_ng"

[[bans.deny]]
crate  = "openssl-sys"
reason = "orno uses rustls; openssl-sys pulls native link dependencies we don't want"

# --- Source policy ---
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []

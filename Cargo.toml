[workspace]
resolver = "2"
members = ["crates/orno-core", "crates/orno-cli"]

[workspace.package]
version = "0.0.1-dev"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/drmozg/orno"
authors = ["Stanislav Gonorovskii"]

[workspace.dependencies]
# Intra-workspace
orno-core = { path = "crates/orno-core", version = "0.0.1-dev" }

# Errors
thiserror = "2"
anyhow = "1"

# Serde stack
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Async runtime — enumerate features explicitly, never use "full"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "sync",
    "time",
    "signal",
    "process",
] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Templating & schema
minijinja = { version = "2", default-features = false, features = ["loader", "builtins", "serde"] }
schemars = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "std",
    "time",
] }

# Time — RFC 3339 timestamps on the event envelope and stderr tracing stream.
# Pinned with minimal features; `serde-well-known` is what unlocks
# `time::serde::rfc3339`.
time = { version = "0.3", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "serde",
    "serde-well-known",
] }

# ULID — sortable, opaque run identifiers. 128-bit, Crockford base32,
# first 48 bits are ms since epoch so ids are lexicographically
# time-ordered. Default features are already minimal.
ulid = "1"

# LLM transport (ADR 0002). Pinned exactly — pre-1.0 API churn is
# expected between betas. genai has no `[features]` table, so the
# workspace-wide `default-features = false` discipline does not apply.
genai = "=0.6.0-beta.17"

# HTTP client for WebFetchHandler (ADR 0008). Pinned to the same major
# that genai pulls transitively. Only `rustls` is enabled (reqwest 0.13
# renamed `rustls-tls` to `rustls`) — no cookies, multipart, or blocking
# pools are needed for a simple GET.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# MCP stack (ADR 0007). Pinned to 1.x; the 1.0 release (2026-03) stabilised
# the API. Access goes only through McpClient (orno-core types never
# re-export rmcp items). Features enumerated explicitly per
# default-features = false discipline; exact names verified at build time.
rmcp = { version = "1.5", default-features = false, features = [
    "client",
    "transport-child-process",
    # Streamable HTTP client + reqwest backend wire ADR 0007's HTTP
    # transport. The `-reqwest` feature transitively enables `__reqwest`
    # and `reqwest?/rustls`, matching the workspace `reqwest` policy
    # (rustls, no native-tls); no separate `reqwest` feature is needed.
    "transport-streamable-http-client-reqwest",
    "macros",
] }

# Replay tape keying. A 256-bit hash of the rendered prompt plus the
# provider+model pair indexes `ReplayTransport`'s in-memory map.
blake3 = "1"

# Tape I/O for `RecordingTransport` / `ReplayTransport` tests. Used from
# integration tests and from round-trip unit tests — pulled at workspace
# level so both crates share the same version.
tempfile = "3"

# Testing
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
rstest = "0.23"
# wiremock stands up an in-process HTTP/1 server we can point an MCP
# client at. Used to exercise the streamable-HTTP transport without a
# live network dep.
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

# Workspace-wide lint policy. Both crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
# Memory safety — orno forbids unsafe under all circumstances.
unsafe_code                    = "forbid"
# Correctness-adjacent: catches real bugs.
let_underscore_drop            = "warn"
meta_variable_misuse           = "warn"
non_ascii_idents               = "forbid"
ambiguous_negative_literals    = "warn"
# Dead-code / unused-item hygiene.
unused_qualifications          = "warn"
unused_import_braces           = "warn"
unused_lifetimes               = "warn"
unused_extern_crates           = "warn"
redundant_lifetimes            = "warn"
explicit_outlives_requirements = "warn"
# Deferred to Phase 2 (blast radius): missing_debug_implementations

[workspace.lints.clippy]
# Pedantic group at low priority so individual overrides win at priority 0.
pedantic = { level = "warn", priority = -1 }

# --- Pedantic lints suppressed (async-trait false positives or skeleton-stage) ---
module_name_repetitions        = "allow"
missing_errors_doc             = "allow"
missing_panics_doc             = "allow"
unnecessary_wraps              = "allow"
must_use_candidate             = "allow"
cast_precision_loss            = "allow"
default_trait_access           = "allow"
unused_async                   = "allow"   # async-trait false positive (clippy#10459)
manual_async_fn                = "allow"   # async-trait false positive (clippy#12664)
needless_pass_by_ref_mut       = "allow"   # async-trait false positive (clippy#11545)

# --- Cherry-picked restriction lints (group intentionally NOT enabled wholesale) ---
dbg_macro                      = "warn"
print_stdout                   = "warn"    # orno-core must not write to stdout directly
print_stderr                   = "warn"    # orno-core must not write to stderr directly
todo                           = "warn"
unimplemented                  = "warn"
allow_attributes               = "warn"
exit                           = "warn"
exhaustive_enums               = "warn"    # safe: skips types already marked #[non_exhaustive]

# Deferred to Phase 2 (blast radius without source cleanup):
# unwrap_used, expect_used (4 production call sites in recording/replay/walker)
# exhaustive_structs (23+ pub structs)

[package]
name = "orno-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for the orno orchestrator."

[[bin]]
name = "orno"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Exposes the `ORNO_TEST_LLM_TRANSPORT` escape hatch (`dummy` /
# `scripted`) to the binary. Off by default so a stock `cargo install`
# build never honors the env var — a misconfigured operator cannot
# swap in the no-API-key fakes by accident. Integration tests that
# need the fakes must build with `--features test-transport`; the
# `cfg(test)` cousin in the source covers in-crate unit tests.
test-transport = []

[dependencies]
orno-core = { workspace = true }

anyhow = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }
clap_complete = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

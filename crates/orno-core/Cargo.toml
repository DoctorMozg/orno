[package]
name = "orno-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for the orno CI-native multi-agent orchestrator."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Config structs legitimately enumerate many boolean capability flags;
# wire-shape fields mirror provider APIs and can't be renamed freely;
# skeleton stubs return Result to preserve the future signature.
struct_excessive_bools = "allow"
struct_field_names = "allow"
unnecessary_wraps = "allow"
# `ToolHandler::{name,description}` return `&str` bound to `&self` so
# `SubagentHandler` can yield a field reference (`&self.yaml_name`, a
# dynamic `subagent.<agent>` string built at pipeline load). Builtin
# handlers return string literals, which the lint wants upgraded to
# `&'static str` — but that would break the dynamic-name impl.
unnecessary_literal_bound = "allow"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
schemars = { workspace = true }
minijinja = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
genai = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
# Used in tests to capture and assert on `tracing::warn!` output from
# failure paths inside the engine. Production code only depends on the
# `tracing` macro crate; this is test-only.
tracing-subscriber = { workspace = true }

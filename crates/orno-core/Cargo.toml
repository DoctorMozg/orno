[package]
name = "orno-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for the orno CI-native multi-agent orchestrator."

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
schemars = { workspace = true }
minijinja = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
genai = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
aho-corasick = { workspace = true }
lru = { workspace = true }
async-trait = "0.1"
# `tempfile::NamedTempFile` is used by the `EditHandler` / `WriteHandler`
# atomic-write path in production, so the dep stays in `[dependencies]`
# rather than `[dev-dependencies]`.
tempfile = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
# Used in tests to capture and assert on `tracing::warn!` output from
# failure paths inside the engine. Production code only depends on the
# `tracing` macro crate; this is test-only.
tracing-subscriber = { workspace = true }
# In-process HTTP server used by mcp_http.rs to exercise the rmcp
# streamable-HTTP client without a live network dep.
wiremock = { workspace = true }

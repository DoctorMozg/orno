name: 'orno-pipeline'
description: 'Run an orno pipeline under runtime-enforced agent contracts (bounded iteration, tools, effects, resources, replay).'
author: 'DoctorMozg'

branding:
  icon: 'play'
  color: 'blue'

inputs:
  pipeline:
    description: 'Path to the pipeline YAML file.'
    required: true
  command:
    description: 'orno subcommand: run | plan | validate | replay.'
    required: false
    default: 'run'
  version:
    description: 'orno version to install (e.g. v0.1.1). Omit for the latest GitHub Release.'
    required: false
  secrets-file:
    description: 'Path to a .env.secrets file forwarded as --secrets-file.'
    required: false
  args:
    description: 'Extra arguments appended to the orno invocation (e.g. --record-bundle run.ndjson).'
    required: false

runs:
  using: composite
  steps:
    - name: Install orno
      shell: bash
      env:
        ORNO_VERSION: ${{ inputs.version }}
        ORNO_INSTALL_DIR: ${{ runner.tool_cache }}/orno
      run: |
        set -euo pipefail
        mkdir -p "$ORNO_INSTALL_DIR"
        # Never silently default to master: fall back to the SHA the caller pinned
        # in their workflow (uses: DoctorMozg/orno@<ref>) via GITHUB_ACTION_REF,
        # which the runner sets automatically for composite actions.
        if [ -n "${ORNO_VERSION:-}" ]; then
          REF="$ORNO_VERSION"
        elif [ -n "${GITHUB_ACTION_REF:-}" ]; then
          REF="$GITHUB_ACTION_REF"
          echo "::warning::ORNO_VERSION not set; using caller-pinned ref: $REF"
        else
          echo "::error::ORNO_VERSION and GITHUB_ACTION_REF are both unset. Pin a version with 'version: vX.Y.Z' or use 'uses: DoctorMozg/orno@vX.Y.Z'."
          exit 1
        fi
        curl --proto '=https' --tlsv1.2 -fsSL \
          "https://raw.githubusercontent.com/DoctorMozg/orno/${REF}/install.sh" | bash
        echo "$ORNO_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Verify orno
      shell: bash
      run: orno --version

    - name: Run orno
      shell: bash
      env:
        ORNO_PIPELINE: ${{ inputs.pipeline }}
        ORNO_COMMAND: ${{ inputs.command }}
        ORNO_SECRETS_FILE: ${{ inputs.secrets-file }}
        ORNO_EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        secrets_flag=()
        if [ -n "$ORNO_SECRETS_FILE" ]; then
          secrets_flag=(--secrets-file "$ORNO_SECRETS_FILE")
        fi
        # Build the args array safely: prefer JSON array form so a value like
        # `--flag "value with spaces"` cannot inject extra flags via word-splitting
        # of attacker-controlled input. Fall back to whitespace splitting only
        # when the caller did not supply JSON (preserves legacy ergonomics).
        args_arr=()
        if [ -n "$ORNO_EXTRA_ARGS" ]; then
          if echo "$ORNO_EXTRA_ARGS" | grep -q '^\['; then
            while IFS= read -r arg; do
              args_arr+=("$arg")
            done < <(echo "$ORNO_EXTRA_ARGS" | jq -r '.[]' 2>/dev/null || echo "$ORNO_EXTRA_ARGS")
          else
            read -ra args_arr <<< "$ORNO_EXTRA_ARGS"
          fi
        fi
        orno "$ORNO_COMMAND" "$ORNO_PIPELINE" "${secrets_flag[@]}" "${args_arr[@]}"

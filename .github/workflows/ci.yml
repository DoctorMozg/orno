name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # TODO: enable strict rustdoc once doc comments are in place
      # env:
      #   RUSTDOCFLAGS: "-D rustdoc::all -A rustdoc::private-doc-tests"
      - run: cargo doc --workspace --all-features --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bnjbvr/cargo-machete@v0.9.2

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1.47.0

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091 -s bash
        with:
          additional_files: install.sh
          scandir: '__NONE__'
          severity: warning

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@cargo-nextest
      # `--all-features` arms `orno-cli/test-transport` so the
      # `ORNO_TEST_LLM_TRANSPORT` escape hatch is live in the binary the
      # CLI integration tests invoke as a subprocess. The feature is off
      # in default builds so `cargo install` users never see it.
      - run: cargo nextest run --workspace --all-targets --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked

  test-mcp-real:
    name: test (real MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test -p orno-core --test mcp_real -- --ignored

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --workspace --locked --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  build-matrix:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --workspace --release --locked

  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build release binary
        run: cargo build --release -p orno-cli --locked
      - name: Smoke-test --version
        run: ./target/release/orno --version
      - name: Schema drift gate
        # Generated schema must match the checked-in copy. Drift here means
        # someone added a pipeline-shape field without running
        # `cargo run -p orno-cli -- schema > schemas/pipeline.schema.json`,
        # which leaves IDE yaml-language-server users with stale autocomplete.
        run: |
          ./target/release/orno schema > /tmp/pipeline.schema.json
          diff -u schemas/pipeline.schema.json /tmp/pipeline.schema.json
      - name: Validate every example
        run: |
          set -euo pipefail
          for ex in examples/*/pipeline.yaml; do
            echo "::group::validate $ex"
            ./target/release/orno validate "$ex"
            echo "::endgroup::"
          done
      - name: Smoke-test plan
        run: ./target/release/orno plan examples/hello/pipeline.yaml

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build CLI with test-transport feature
        # `test-transport` arms the `ORNO_TEST_LLM_TRANSPORT` escape hatch
        # so a real `orno run` can complete without a live API key. Stock
        # `cargo install` builds omit the feature, so this binary is
        # CI-only and never ships to users.
        run: cargo build -p orno-cli --features test-transport --locked
      - name: Run hello pipeline against the dummy transport
        env:
          ORNO_TEST_LLM_TRANSPORT: dummy
        run: |
          set -euo pipefail
          out=$(./target/debug/orno run examples/hello/pipeline.yaml)
          test -n "$out"
          echo "$out" | tail -1 \
            | jq -e '.event.type == "run_finished" and .event.ok == true' >/dev/null

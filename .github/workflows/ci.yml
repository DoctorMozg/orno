name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  machete:
    name: machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@cf5f1c29a8ac336af8568821ec41919923b05a83 # v1.45.1

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091 -s bash
        with:
          additional_files: install.sh
          scandir: '__NONE__'
          severity: warning

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@0c93fdc2693eb512dd81ffc25d20c621d8feadb8 # cargo-nextest tag
        with:
          tool: cargo-nextest
      # `--all-features` arms `orno-cli/test-transport` so the
      # `ORNO_TEST_LLM_TRANSPORT` escape hatch is live in the binary the
      # CLI integration tests invoke as a subprocess. The feature is off
      # in default builds so `cargo install` users never see it.
      - run: cargo nextest run --workspace --all-targets --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked

  test-mcp-real:
    name: test (real MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: actions/setup-node@v6
        with:
          # The pinned @modelcontextprotocol/server-filesystem needs node >= 24.
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Serial: two parallel `npx -y` cold installs of the same package race
      # on the npx cache and one server can exit before the handshake.
      - run: cargo test -p orno-core --locked --test mcp_real -- --ignored --test-threads=1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@9299c56f1fb893650f348425bb02c3acf492ebd2 # cargo-llvm-cov tag
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          fail_ci_if_error: false

  build-matrix:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --workspace --release --locked

  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build release binary
        run: cargo build --release -p orno-cli --locked
      - name: Smoke-test --version
        run: ./target/release/orno --version
      - name: Schema drift gate
        # Generated schema must match the checked-in copy. Drift here means
        # someone added a pipeline-shape field without running
        # `cargo run -p orno-cli -- schema > schemas/pipeline.schema.json`,
        # which leaves IDE yaml-language-server users with stale autocomplete.
        run: |
          ./target/release/orno schema > /tmp/pipeline.schema.json
          diff -u schemas/pipeline.schema.json /tmp/pipeline.schema.json
      - name: Validate every example
        run: |
          set -euo pipefail
          for ex in examples/*/pipeline.yaml; do
            echo "::group::validate $ex"
            ./target/release/orno validate "$ex"
            echo "::endgroup::"
          done
      - name: Smoke-test plan
        run: ./target/release/orno plan examples/hello/pipeline.yaml

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build CLI with test-transport feature
        # `test-transport` arms the `ORNO_TEST_LLM_TRANSPORT` escape hatch
        # so a real `orno run` can complete without a live API key. Stock
        # `cargo install` builds omit the feature, so this binary is
        # CI-only and never ships to users.
        run: cargo build -p orno-cli --features test-transport --locked
      - name: Run hello pipeline against the dummy transport
        env:
          ORNO_TEST_LLM_TRANSPORT: dummy
        run: |
          set -euo pipefail
          out=$(./target/debug/orno run examples/hello/pipeline.yaml)
          test -n "$out"
          echo "$out" | tail -1 \
            | jq -e '.event.type == "run_finished" and .event.ok == true' >/dev/null

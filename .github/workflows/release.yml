name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Take the first `version = "..."` after [workspace.package]; a tag
          # that disagrees with Cargo.toml would ship binaries reporting the
          # wrong --version.
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ -z "$manifest" ] || [ "${TAG#v}" != "$manifest" ]; then
            echo "error: tag $TAG does not match workspace.package.version '$manifest'" >&2
            exit 1
          fi
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Created as draft so consumers cannot pull a release whose binary
          # assets have not finished uploading yet (see publish-release below).
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true

  upload-assets:
    name: upload (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # Default fail-fast (true) prevents publishing a release with a partial
      # asset matrix: any platform failure aborts the rest, leaving the draft
      # in place for manual triage rather than auto-publishing later.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: orno
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256

  publish-release:
    name: publish release
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (un-draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Flip draft to false only after every matrix asset has uploaded.
          # Until this step runs, install.sh's "latest release" lookup will
          # not see the tag, so users cannot pull an incomplete release.
          gh release edit "$TAG" --draft=false --repo "$REPO"

  update-major-tag:
    name: update major tag
    needs: publish-release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}
    # Serialize concurrent runs against the same ref so two overlapping
    # releases cannot race on `git push -f origin <major>` and end up with
    # a major tag that points at the wrong commit.
    concurrency:
      group: release-major-tag-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move major tag to latest release
        env:
          FULL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Reject anything that doesn't look like a clean release tag before
          # we feed it to git -- the `if:` above already filters prereleases,
          # but a defense-in-depth check stops a malformed ref from reaching
          # `git tag -f`.
          if ! echo "$FULL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: unexpected tag format: $FULL_TAG" >&2
            exit 1
          fi
          major="${FULL_TAG%%.*}"
          if [ -z "$major" ] || [ "$major" = "$FULL_TAG" ]; then
            echo "could not derive major tag from $FULL_TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$FULL_TAG"
          git push -f origin "$major"

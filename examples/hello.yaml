# yaml-language-server: $schema=../schemas/pipeline.schema.json
# Minimal hello pipeline — one agent node with max_iterations=1 through LoopAgent.
# Regenerate the schema after NodeKind changes: `orno schema > schemas/pipeline.schema.json`.

version: 1

vars:
  target: README.md

agents:
  greeter:
    model: openai/gpt-5
    provider: openrouter
    system: "You are friendly."
    allowed_tools: []
    policy:
      max_iterations: 1
      max_total_tokens: 1000
      max_tool_calls: 0
      max_subagent_depth: 0
      allow_mutations: false
      allow_network: false
      on_parse_error: fail

nodes:
  - id: greet
    kind: agent
    agent: greeter
    initial_prompt: "Say hello to {{ vars.target }} in one sentence."
